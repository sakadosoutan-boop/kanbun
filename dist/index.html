<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢文道場 — 句法と訓読をゲームで鍛える</title>
<meta name="description" content="高校生のための漢文トレーニングアプリ。再読文字・句法・返り点・置き字・漢詩・故事成語を、ゲーム感覚で復習できます。">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23b8443a'/><text x='32' y='45' font-size='40' text-anchor='middle' fill='%23fff8f0' font-family='serif'>漢</text></svg>">
<style>
/* ============================================================
   漢文道場 — stylesheet
   和モダン：墨・生成り・朱・金
   ============================================================ */

:root {
  --paper:      #f4efe4;
  --paper-2:    #ece5d6;
  --card:       #fffdf8;
  --ink:        #1f1d1a;
  --ink-2:      #4a453d;
  --ink-3:      #7d766a;
  --line:       #d9d0bd;
  --shu:        #b8443a;   /* 朱 */
  --shu-soft:   #e8c3bd;
  --kin:        #b7913f;   /* 金 */
  --ai:         #2f5069;   /* 藍 */
  --midori:     #4a7a5c;
  --murasaki:   #6b5b8e;
  --ok:         #2f7d54;
  --ng:         #b8443a;
  --shadow:     0 1px 2px rgba(31,29,26,.06), 0 6px 20px rgba(31,29,26,.08);
  --shadow-lg:  0 2px 6px rgba(31,29,26,.08), 0 18px 48px rgba(31,29,26,.14);
  --topbar-h:   59px;
  --radius:     16px;
  --radius-sm:  10px;
  /* 末尾の IPA 系は Linux 向けの保険。縦書きには vmtx を持つフォントが必要で、
     一部ディストリの既定 serif には縦方向のメトリクスが無いことがある。 */
  --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", "Songti SC", "IPAMincho", "IPAPGothic", serif;
  --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", system-ui, "IPAPGothic", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:    #16151a;
    --paper-2:  #1d1c22;
    --card:     #23222a;
    --ink:      #eee9df;
    --ink-2:    #c3bcae;
    --ink-3:    #8d8578;
    --line:     #383641;
    --shu:      #e0685c;
    --shu-soft: #5a2f2c;
    --kin:      #d5b062;
    --ai:       #7aa5c4;
    --midori:   #7bb392;
    --murasaki: #a696cc;
    --ok:       #6cc294;
    --ng:       #e0685c;
    --shadow:   0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 18px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"] {
  --paper: #f4efe4; --paper-2:#ece5d6; --card:#fffdf8; --ink:#1f1d1a; --ink-2:#4a453d;
  --ink-3:#7d766a; --line:#d9d0bd; --shu:#b8443a; --shu-soft:#e8c3bd; --kin:#b7913f;
  --ai:#2f5069; --midori:#4a7a5c; --murasaki:#6b5b8e; --ok:#2f7d54; --ng:#b8443a;
  --shadow:0 1px 2px rgba(31,29,26,.06), 0 6px 20px rgba(31,29,26,.08);
  --shadow-lg:0 2px 6px rgba(31,29,26,.08), 0 18px 48px rgba(31,29,26,.14);
}
:root[data-theme="dark"] {
  --paper:#16151a; --paper-2:#1d1c22; --card:#23222a; --ink:#eee9df; --ink-2:#c3bcae;
  --ink-3:#8d8578; --line:#383641; --shu:#e0685c; --shu-soft:#5a2f2c; --kin:#d5b062;
  --ai:#7aa5c4; --midori:#7bb392; --murasaki:#a696cc; --ok:#6cc294; --ng:#e0685c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 18px 48px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--gothic);
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--kin) 10%, transparent), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--ai) 10%, transparent), transparent 55%);
  -webkit-font-smoothing: antialiased;
  line-height: 1.75;
  overflow-wrap: anywhere;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
h1,h2,h3,h4 { line-height: 1.35; margin: 0; }

/* ---------- layout ---------- */
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(12px);
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 880px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--mincho); }
.seal {
  width: 34px; height: 34px; flex: none; border-radius: 7px;
  background: var(--shu); color: #fff8f0;
  display: grid; place-items: center;
  font-family: var(--mincho); font-size: 13px; font-weight: 700; letter-spacing: -1px;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--shu) 40%, transparent);
  line-height: 1.05; text-align: center;
}
.brand b { font-size: 17px; letter-spacing: .06em; font-weight: 600; }
.brand small { display: block; font-family: var(--gothic); font-size: 10px; color: var(--ink-3); letter-spacing: .18em; white-space: nowrap; }
@media (max-width: 420px) { .brand small { display: none; } .topbar-in { gap: 8px; } .icon-btn { width: 34px; } }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-2); border: 1px solid transparent;
  font-family: var(--mincho); font-size: 16px; line-height: 1;
}
.icon-btn:hover { background: var(--paper-2); border-color: var(--line); }

/* ---------- hero ---------- */
.hero { padding: 26px 0 6px; }
.hero h1 { font-family: var(--mincho); font-size: clamp(26px, 6vw, 38px); letter-spacing: .06em; }
.hero p { color: var(--ink-2); margin: 8px 0 0; font-size: 14px; }

.rankbar {
  margin-top: 18px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
}
.rank-badge {
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--mincho); font-size: 20px; color: #fff;
  background: linear-gradient(145deg, var(--kin), color-mix(in srgb, var(--kin) 65%, #7a5a1e));
  box-shadow: inset 0 -2px 6px rgba(0,0,0,.2), 0 3px 12px color-mix(in srgb, var(--kin) 35%, transparent);
}
.rank-meta { min-width: 0; }
.rank-meta .r-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rank-meta b { font-family: var(--mincho); font-size: 19px; letter-spacing: .05em; }
.rank-meta .r-xp { font-size: 12px; color: var(--ink-3); }
.bar { height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; margin-top: 8px; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--kin), var(--shu)); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; }
.stat b { display: block; font-family: var(--mincho); font-size: 22px; line-height: 1.2; }
.stat span { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }

/* ---------- section ---------- */
.sec-h { display: flex; align-items: center; gap: 10px; margin: 30px 0 12px; }
.sec-h h2 { font-family: var(--mincho); font-size: 17px; letter-spacing: .14em; }
.sec-h .rule { flex: 1; height: 1px; background: var(--line); }

/* ---------- mode cards ---------- */
.modes { display: grid; grid-template-columns: 1fr; gap: 12px; }
.mode {
  position: relative; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, border-color .18s;
  display: block; width: 100%; overflow: hidden;
}
.mode:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--accent, var(--kin)) 45%, var(--line)); }
.mode:active { transform: translateY(-1px); }
.mode::after {
  content: ""; position: absolute; inset: auto -30px -30px auto; width: 90px; height: 90px; border-radius: 50%;
  background: color-mix(in srgb, var(--accent, var(--kin)) 12%, transparent);
}
.mode .m-ico {
  position: relative; z-index: 1;
  width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--mincho); font-size: 20px; line-height: 1;
  color: var(--accent, var(--kin));
  background: color-mix(in srgb, var(--accent, var(--kin)) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent, var(--kin)) 32%, transparent);
}
.mode .m-t { font-family: var(--mincho); font-size: 17px; letter-spacing: .05em; margin-top: 6px; }
.mode .m-d { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.6; position: relative; z-index: 1; }
.mode .m-tag {
  position: absolute; top: 12px; right: 12px; font-size: 10px; letter-spacing: .1em;
  padding: 2px 8px; border-radius: 99px; color: var(--accent, var(--kin));
  background: color-mix(in srgb, var(--accent, var(--kin)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent, var(--kin)) 30%, transparent);
}
.mode .m-prog { margin-top: 10px; font-size: 11px; color: var(--ink-3); position: relative; z-index: 1; }

/* ---------- generic card / buttons ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 99px; font-size: 14px; font-weight: 600;
  background: var(--ink); color: var(--paper); transition: transform .12s, opacity .12s, background .15s;
}
.btn:hover { opacity: .9; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.shu { background: var(--shu); color: #fff; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- game HUD ---------- */
.hud {
  position: sticky; top: var(--topbar-h); z-index: 30; margin: 0 -16px 14px; padding: 10px 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.hud-row { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-2); }
.hud-row .q-no { font-family: var(--mincho); font-size: 14px; letter-spacing: .05em; }
.hud-row .sp { flex: 1; }
.hud-score { font-family: var(--mincho); font-size: 18px; }
.combo { color: var(--shu); font-weight: 700; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; transform: translateY(4px); }
.combo.on { opacity: 1; transform: none; }
.timer { height: 5px; border-radius: 99px; background: var(--paper-2); overflow: hidden; margin-top: 8px; border: 1px solid var(--line); }
.timer > i { display: block; height: 100%; background: linear-gradient(90deg, var(--midori), var(--kin)); transition: width .25s linear; }
.timer.warn > i { background: linear-gradient(90deg, var(--kin), var(--shu)); }
.hearts { letter-spacing: 2px; font-size: 14px; }

/* ---------- question ---------- */
.q-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px;
  display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start;
}
.q-main { display: grid; gap: 12px; align-content: start; min-width: 0; }
.q-main .q-cat { justify-self: start; }
.q-aside { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.q-stem-wrap { display: flex; justify-content: center; width: 100%; overflow-x: auto; }
.q-cat { display: inline-block; font-size: 11px; letter-spacing: .12em; color: var(--ai); background: color-mix(in srgb, var(--ai) 12%, transparent); border: 1px solid color-mix(in srgb, var(--ai) 28%, transparent); padding: 2px 10px; border-radius: 99px; }
.q-stem {
  font-family: var(--mincho); font-size: clamp(20px, 5.2vw, 27px); letter-spacing: .1em;
  margin: 4px 0 2px; line-height: 1.9; text-align: center;
}
/* 返り点：直前の一字を包んで絶対配置する。横書きは右下、縦書きは左下（伝統的な位置）。 */
.kc { position: relative; margin-inline-end: .16em; }
.mark {
  position: absolute; font-style: normal; white-space: nowrap;
  color: var(--shu); font-family: var(--gothic);
  font-size: .44em; line-height: 1; letter-spacing: -.04em;
  right: -.30em; bottom: -.10em;
}
.q-src { text-align: center; font-size: 11px; color: var(--ink-3); }
.q-text { margin: 0; font-size: 15px; }

.choices { display: grid; gap: 9px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  padding: 13px 15px; border-radius: var(--radius-sm); border: 1.5px solid var(--line);
  background: var(--card); font-size: 15px; transition: border-color .14s, background .14s, transform .1s;
}
.choice:hover:not(:disabled) { border-color: var(--ink-3); background: var(--paper-2); }
.choice:active:not(:disabled) { transform: scale(.995); }
.choice .k {
  flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  background: var(--paper-2); border: 1px solid var(--line); font-size: 12px; font-family: var(--mincho); color: var(--ink-2);
}
.choice.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--card)); }
.choice.correct .k { background: var(--ok); color: #fff; border-color: var(--ok); }
.choice.wrong { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 12%, var(--card)); }
.choice.wrong .k { background: var(--ng); color: #fff; border-color: var(--ng); }
.choice:disabled { cursor: default; }

.verdict { border-radius: var(--radius-sm); padding: 14px 16px; border: 1px solid var(--line); background: var(--paper-2); animation: pop .25s cubic-bezier(.2,.8,.2,1); }
.verdict .v-h { font-family: var(--mincho); font-size: 16px; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.verdict.ok .v-h { color: var(--ok); }
.verdict.ng .v-h { color: var(--ng); }
.verdict p { margin: 8px 0 0; font-size: 13.5px; color: var(--ink-2); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.shake { animation: shake .32s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }

/* ---------- 返り点パズル ---------- */
.kt-stage { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 18px 0 6px; }
.kt-char {
  position: relative; width: 60px; height: 74px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--card); font-family: var(--mincho); font-size: 28px; display: grid; place-items: center;
  transition: transform .12s, border-color .14s, background .14s;
}
.kt-char:hover:not(:disabled):not(.done) { border-color: var(--ink-3); transform: translateY(-2px); }
.kt-char .mk { position: absolute; left: 3px; bottom: 2px; font-size: 11px; color: var(--shu); font-family: var(--gothic); letter-spacing: -.5px; }
.kt-char .ord {
  position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ai); color: #fff; font-size: 11px; font-family: var(--gothic);
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.kt-char.done { background: color-mix(in srgb, var(--ai) 10%, var(--card)); border-color: var(--ai); color: var(--ink-2); }
.kt-char.bad { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 12%, var(--card)); }

/* ---------- 置き字ハンター ---------- */
.ok-stage { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
.ok-char {
  width: 54px; height: 62px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card);
  font-family: var(--mincho); font-size: 26px; display: grid; place-items: center; transition: all .14s;
}
.ok-char:hover:not(:disabled) { border-color: var(--ink-3); transform: translateY(-2px); }
.ok-char.sel { border-color: var(--kin); background: color-mix(in srgb, var(--kin) 16%, var(--card)); }
.ok-char.hit { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--card)); }
.ok-char.miss { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 16%, var(--card)); text-decoration: line-through; }

/* ---------- 並べ替え ---------- */
.nb-slot {
  min-height: 58px; border: 1.5px dashed var(--line); border-radius: var(--radius-sm);
  padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
  background: color-mix(in srgb, var(--paper-2) 60%, transparent);
}
.nb-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  padding: 8px 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--card);
  font-family: var(--mincho); font-size: 16px; letter-spacing: .04em; transition: all .13s;
}
.chip:hover:not(:disabled) { border-color: var(--ink-3); transform: translateY(-2px); }
.chip.placed { background: color-mix(in srgb, var(--ai) 12%, var(--card)); border-color: var(--ai); }
.chip.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--card)); }
.chip.ng { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 14%, var(--card)); }
.chip:disabled { opacity: .35; }

/* ---------- result ---------- */
.result { text-align: center; padding: 26px 18px; }
.result .r-rank { font-family: var(--mincho); font-size: 56px; line-height: 1; color: var(--kin); }
.result .r-score { font-family: var(--mincho); font-size: 40px; margin-top: 6px; }
.result .r-sub { color: var(--ink-3); font-size: 13px; }
.result .r-msg { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.r-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 18px; }

.review { margin-top: 20px; text-align: left; }
.review-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 9px; background: var(--card); }
.review-item .ri-q { font-size: 13.5px; }
.review-item .ri-stem { font-family: var(--mincho); font-size: 17px; margin-bottom: 4px; letter-spacing: .06em; }
.review-item .ri-a { font-size: 13px; color: var(--ok); margin-top: 6px; }
.review-item .ri-y { font-size: 13px; color: var(--ng); }
.review-item .ri-e { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }

/* ---------- 図鑑 ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
.pill {
  padding: 6px 13px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px;
  background: var(--card); color: var(--ink-2); transition: all .13s;
}
.pill:hover { border-color: var(--ink-3); }
.pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.search {
  width: 100%; padding: 11px 15px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--card); font-size: 14px; outline: none;
}
.search:focus { border-color: var(--kin); box-shadow: 0 0 0 3px color-mix(in srgb, var(--kin) 18%, transparent); }

.kuho-item { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
.kuho-head { width: 100%; text-align: left; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.kuho-head:hover { background: var(--paper-2); }
.kuho-head .kh-main { flex: 1; min-width: 0; }
.kuho-head .kh-form { display: block; font-family: var(--mincho); font-size: 19px; letter-spacing: .06em; line-height: 1.5; }
.kuho-head .kh-read { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.5; }
.kuho-head .kh-cat { font-size: 10.5px; letter-spacing: .1em; padding: 2px 9px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); color: var(--ink-2); flex: none; }
.lv { flex: none; font-size: 10px; letter-spacing: .06em; color: var(--kin); }
.kuho-body { padding: 0 16px 16px; border-top: 1px dashed var(--line); }
.kuho-body .kb-mean { margin: 12px 0 0; font-size: 15px; }
.kuho-body .kb-note { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); background: var(--paper-2); border-radius: var(--radius-sm); padding: 10px 12px; }
.ex { margin-top: 12px; border-left: 3px solid var(--shu-soft); padding-left: 12px; }
.ex .ex-k { font-family: var(--mincho); font-size: 17px; letter-spacing: .08em; }
.ex .ex-y { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.ex .ex-t { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.ex .ex-s { font-size: 11px; color: var(--kin); margin-top: 3px; }

/* ---------- lessons ---------- */
.lesson-body { font-size: 15px; }
.lesson-body p { margin: 0 0 14px; }
.l-tip { background: color-mix(in srgb, var(--kin) 10%, transparent); border: 1px solid color-mix(in srgb, var(--kin) 30%, transparent); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; }
.l-table { width: 100%; border-collapse: collapse; margin: 4px 0 16px; font-size: 13.5px; }
.l-table th, .l-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
.l-table th { background: var(--paper-2); font-weight: 600; font-size: 12.5px; letter-spacing: .04em; }
.l-table i { color: var(--shu); font-style: normal; font-size: .8em; vertical-align: super; }
.l-ol { padding-left: 1.3em; margin: 0 0 14px; }
.l-ol li { margin-bottom: 9px; font-size: 14.5px; }
.l-flow { display: grid; gap: 10px; margin: 4px 0 16px; }
.l-step { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--paper-2); }
.l-step b { display: inline-block; font-size: 11px; letter-spacing: .12em; color: var(--shu); }
.l-step span { display: block; font-family: var(--mincho); font-size: 20px; letter-spacing: .1em; margin: 3px 0; }
.l-step i { color: var(--shu); font-style: normal; font-size: .65em; vertical-align: super; }
.l-step small { color: var(--ink-3); font-size: 11.5px; }
.l-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 16px; }
.l-cmp > div { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--card); }
.l-cmp > div > b { display: block; font-family: var(--mincho); letter-spacing: .05em; margin-bottom: 6px; color: var(--ai); }
.l-cmp p { margin: 0; font-size: 13.5px; }
@media (max-width: 520px) { .l-cmp { grid-template-columns: 1fr; } }

/* ---------- poem ---------- */
.poem { text-align: center; font-family: var(--mincho); }
.poem .p-line { font-size: clamp(17px, 4.6vw, 21px); letter-spacing: .16em; margin: 3px 0; }
.poem .p-line.rhy { color: var(--shu); }
.poem .p-line .rh { border-bottom: 2px solid var(--shu); }
.poem .p-yomi { font-size: 13px; color: var(--ink-3); font-family: var(--gothic); margin-top: 12px; line-height: 1.9; }
.poem-meta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.tagl { font-size: 11px; letter-spacing: .08em; padding: 3px 10px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); color: var(--ink-2); }

/* ---------- misc ---------- */
.center { text-align: center; }
.muted { color: var(--ink-3); font-size: 13px; }
.mt { margin-top: 16px; }
.mt-l { margin-top: 26px; }
.empty { text-align: center; padding: 46px 20px; color: var(--ink-3); }
.empty .e-ico { font-size: 34px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px);
  background: var(--ink); color: var(--paper); padding: 11px 20px; border-radius: 99px;
  font-size: 13.5px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 90; max-width: calc(100% - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; }
.ach-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; background: var(--card); text-align: center; opacity: .42; filter: grayscale(1); transition: all .2s; }
.ach-item.got { opacity: 1; filter: none; border-color: color-mix(in srgb, var(--kin) 45%, var(--line)); }
.ach-item .a-ico {
  width: 40px; height: 40px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--mincho); font-size: 20px; line-height: 1; color: var(--kin);
  background: color-mix(in srgb, var(--kin) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--kin) 36%, transparent);
}
.ach-item.got .a-ico { color: #fff; background: linear-gradient(145deg, var(--kin), color-mix(in srgb, var(--kin) 62%, #7a5a1e)); border-color: transparent; }
.ach-item .a-t { font-family: var(--mincho); font-size: 13.5px; margin-top: 4px; }
.ach-item .a-d { font-size: 11px; color: var(--ink-3); margin-top: 2px; line-height: 1.5; }

.fade { animation: fade .3s cubic-bezier(.2,.8,.2,1); }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); text-align: center; }

/* ============================================================
   縦書き（漢文本文）
   html.vert のときだけ漢文本文を vertical-rl にする。
   設問文・選択肢・解説は横書きのまま（読みやすさを優先）。
   ============================================================ */
.vert .q-stem {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  line-height: 2.15;              /* 縦書きでは行の高さ＝列の幅になる */
  letter-spacing: .14em;
  /* 縦組みは inline サイズ（画面上の高さ）が確定しないと 1 列に潰れる。
     字数 --n から必要な高さを求め、画面に収まらないぶんは列を折り返させる。 */
  --adv: 1.22em;
  --cap: min(38vh, 320px);   /* スマホ縦。これを超える長さは列を折り返す */
  height: min(var(--cap), calc(var(--n, 12) * var(--adv) + 8px));
  text-align: start;
  padding-block: 2px;             /* 返り点が左にはみ出すぶんの余白 */
}
.q-stem-wrap { align-items: flex-start; }
.vert .kc .mark { right: auto; left: -.40em; bottom: -.04em; }

/* 漢詩：句を右から左へ列で並べる */
.p-lines { display: block; }
.vert .p-lines {
  display: flex; flex-direction: row-reverse; justify-content: center;
  gap: .45em; margin-inline: auto;
}
.vert .p-lines { align-items: flex-start; }
.vert .p-lines .p-line {
  writing-mode: vertical-rl; text-orientation: mixed; margin: 0; line-height: 2;
  height: calc(var(--n, 7) * 1.26em + 6px);
}

/* 句法図鑑の例文：白文を右に縦組み、書き下し・訳を左に置く */
.vert .ex {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 14px; align-items: start;
}
.vert .ex > *:not(.ex-k) { grid-column: 1; }
.vert .ex-k {
  grid-column: 2; grid-row: 1 / span 4;
  writing-mode: vertical-rl; text-orientation: mixed;
  height: min(250px, calc(var(--n, 8) * 1.2em + 6px));
  line-height: 2.1; letter-spacing: .1em;
}

/* 返り点パズル・置き字ハンター：上から下へ、列は右から左へ折り返す */
.vert .kt-stage, .vert .ok-stage {
  flex-flow: column wrap-reverse;
  align-content: center; justify-content: flex-start;
  max-height: min(52vh, 430px);
  gap: 6px 10px;
}
.vert .kt-char { width: 54px; height: 60px; font-size: 25px; }
.vert .ok-char { width: 50px; height: 54px; font-size: 24px; }
/* 縦組みでは返り点は字の左下、読み順の番号は右上に出す */
.vert .kt-char .mk { left: 3px; bottom: 2px; }

/* ============================================================
   端末別レイアウト
   ============================================================ */

/* --- スマホ横（高さが足りない）：縦の余白を削り、一画面に収める --- */
@media (orientation: landscape) and (max-height: 560px) {
  .hero { padding: 12px 0 2px; }
  .hero h1 { font-size: 23px; }
  .hero p { font-size: 12.5px; margin-top: 4px; }
  .rankbar { margin-top: 12px; padding: 10px 14px; gap: 12px; }
  .rank-badge { width: 44px; height: 44px; font-size: 16px; }
  .rank-meta b { font-size: 16px; }
  .stats { margin-top: 8px; }
  .stat b { font-size: 18px; }
  .sec-h { margin: 18px 0 10px; }
  .hud { padding: 7px 16px; margin-bottom: 10px; }
  .q-card { padding: 14px 16px; gap: 10px; }
  .q-stem { font-size: 21px; margin: 0; }
  .vert .q-stem { --cap: 36vh; }
  .choice { padding: 9px 13px; font-size: 14px; }
  .choices { gap: 7px; }
  .result { padding: 16px 14px; }
  .result .r-rank { font-size: 40px; }
  .result .r-score { font-size: 30px; }
  .vert .kt-stage, .vert .ok-stage { max-height: 40vh; }
  .kt-char { width: 52px; height: 62px; font-size: 25px; }
}

/* --- 2 列（大きめのスマホ横／タブレット縦から） --- */
@media (min-width: 540px) {
  .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* --- タブレット縦：本文を少し大きく、幅を絞って読みやすく --- */
@media (min-width: 700px) and (orientation: portrait) {
  .wrap, .topbar-in { max-width: 740px; }
  .q-text { font-size: 16px; }
  .choice { font-size: 16px; padding: 15px 17px; }
  .lesson-body { font-size: 16px; }
  .vert .q-stem { --cap: min(44vh, 440px); }
}

/* --- 横長（タブレット横・PC）：漢文を右の柱に、選択肢を左に置く --- */
@media (min-width: 760px) and (orientation: landscape) {
  .q-card.two { grid-template-columns: minmax(0, 1fr) auto; column-gap: 26px; }
  .q-card.two .q-main  { order: 1; }
  .q-card.two .q-aside { order: 2; border-inline-start: 1px solid var(--line); padding-inline-start: 24px; }
  .vert .q-card.two .q-stem { --cap: min(62vh, 480px); }
  .q-card.two .q-aside { align-self: stretch; }
  .q-card.two .q-aside { max-width: 46%; }
}

/* --- 3 列＋広め（PC・タブレット横） --- */
@media (min-width: 960px) {
  .wrap, .topbar-in { max-width: 960px; }
  .modes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero { padding: 34px 0 6px; }
}

/* --- タッチ端末：タップ領域を広げる --- */
@media (hover: none) {
  .choice { min-height: 52px; align-items: center; }
  .chip { padding: 11px 16px; }
  .pill { padding: 9px 15px; }
  .kuho-head { padding: 16px; }
  .mode:hover { transform: none; box-shadow: var(--shadow); }
  .icon-btn:hover { background: none; border-color: transparent; }
}

/* --- 縦書きが使えない環境向けの保険 --- */
@supports not (writing-mode: vertical-rl) {
  .vert .q-stem, .vert .ex-k, .vert .p-lines .p-line { writing-mode: horizontal-tb; }
  .vert .kt-stage, .vert .ok-stage { flex-flow: row wrap; }
}

/* スマホ横は「横長 2 カラム」の指定と両方に当たるので、打ち消せるよう末尾に置く。
   セレクタの詳細度を揃えたうえで、後ろに書いて勝たせている。 */
@media (orientation: landscape) and (max-height: 560px) {
  .vert .q-stem,
  .vert .q-card.two .q-stem { --cap: min(34vh, 165px); }
  .q-card.two .q-aside { max-width: 42%; padding-inline-start: 16px; }
  .vert .p-lines .p-line { font-size: 17px; }
}

/* --- スマホ縦：モードカードを横並びにして一覧性を上げる --- */
@media (max-width: 539px) {
  .mode {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    column-gap: 13px; padding: 13px 14px;
  }
  .mode .m-ico { grid-row: 1 / span 3; align-self: start; margin-top: 1px; }
  .mode .m-t { margin-top: 0; padding-inline-end: 52px; }
  .mode .m-d { margin-top: 2px; }
  .mode .m-prog { margin-top: 4px; }
  .mode::after { width: 66px; height: 66px; inset: auto -24px -24px auto; }
  .mode .m-tag { top: 13px; right: 13px; }
  .modes { gap: 9px; }
}

/* ============================================================
   確認ダイアログ（埋め込み表示では confirm が使えないため自前で出す）
   ============================================================ */
.ovl {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  padding: 20px; background: color-mix(in srgb, var(--ink) 42%, transparent);
  backdrop-filter: blur(3px); animation: fade .18s ease-out;
}
.dlg {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 22px; max-width: 400px; width: 100%;
  animation: pop .22s cubic-bezier(.2,.8,.2,1);
}
.dlg p { margin: 0; font-size: 15px; line-height: 1.8; }

/* ============================================================
   道場破り
   ============================================================ */
.foe-card { text-align: center; display: grid; gap: 10px; justify-items: center; }
.foe-glyph {
  width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--mincho); font-size: 21px; line-height: 1; color: #fff;
  background: linear-gradient(150deg, var(--shu), color-mix(in srgb, var(--shu) 55%, #4a1410));
  box-shadow: inset 0 -2px 5px rgba(0,0,0,.22), 0 2px 10px color-mix(in srgb, var(--shu) 34%, transparent);
}
.foe-glyph.big { width: 78px; height: 78px; font-size: 38px; }
.foe-glyph.beaten { filter: grayscale(.75); opacity: .8; }
.foe-name { font-family: var(--mincho); font-size: 22px; letter-spacing: .07em; line-height: 1.4; }
.foe-name small { display: block; font-family: var(--gothic); font-size: 11px; letter-spacing: .12em; color: var(--ink-3); }
.foe-taunt {
  margin: 4px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.9;
  max-width: 34em; text-align: left;
  border-inline-start: 3px solid var(--shu-soft); padding-inline-start: 13px;
}
.gate-clear { font-family: var(--mincho); font-size: clamp(24px, 6vw, 32px); letter-spacing: .1em; color: var(--shu); margin-top: 8px; }

/* 対戦中の HUD */
.foe-mini { flex: 1; min-width: 0; display: grid; gap: 4px; }
.foe-mini b { font-family: var(--mincho); font-size: 13.5px; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ki { display: block; height: 7px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; }
.ki > i {
  display: block; height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--shu) 70%, #000), var(--shu));
  transition: width .45s cubic-bezier(.2,.8,.2,1);
}
.ki.low > i { background: linear-gradient(90deg, var(--kin), var(--shu)); }

/* ============================================================
   返り点ルートの縦組みを一本の列として見せる
   ============================================================ */
.vert .kt-stage { gap: 3px 14px; }
.vert .kt-char { width: 58px; height: 58px; border-radius: 8px; }
.vert .kt-char .ord { top: 50%; right: -9px; transform: translateY(-50%); }
.vert .kt-char .mk { left: 3px; bottom: 1px; }
.kt-hint { text-align: center; font-size: 11.5px; color: var(--ink-3); letter-spacing: .1em; }

/* ============================================================
   学びの記録
   ============================================================ */
.sec-min { font-family: var(--mincho); font-size: 13px; letter-spacing: .14em; color: var(--ink-3); text-align: center; margin-bottom: 10px; }

/* 今日のカード */
.rec-today { text-align: center; padding: 22px 18px; }
.rt-label { font-size: 12px; letter-spacing: .14em; color: var(--ink-3); }
.rt-num {
  font-family: var(--mincho); font-size: clamp(44px, 13vw, 68px); line-height: 1.05;
  letter-spacing: .02em; margin-top: 2px; font-variant-numeric: tabular-nums;
}
.rt-num small { font-size: .34em; margin-inline-start: .12em; color: var(--ink-2); }
.rt-say {
  margin: 8px 0 0; font-size: 14px; color: var(--shu); font-weight: 600; line-height: 1.8;
}
.rt-sub { margin-top: 8px; font-size: 12px; color: var(--ink-3); }

/* 三つの数字 */
.rec-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.rn {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 13px 8px 11px; text-align: center; position: relative;
}
.rn b { display: block; font-family: var(--mincho); font-size: clamp(22px, 6.5vw, 30px); line-height: 1.15; font-variant-numeric: tabular-nums; }
.rn small { font-family: var(--mincho); font-size: .46em; color: var(--ink-2); margin-inline-start: .1em; font-weight: 400; }
.rn span { display: block; font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em; margin-top: 3px; }
.rn:nth-child(1) b { color: var(--midori); }
.rn:nth-child(2) b { color: var(--kin); }
.rn:nth-child(3) b { color: var(--shu); }

/* 竹簡 */
.chikan-head { text-align: center; font-family: var(--mincho); font-size: 15px; letter-spacing: .1em; margin-bottom: 12px; }
.chikan-head b { font-size: 26px; color: var(--midori); font-variant-numeric: tabular-nums; }
.chikan {
  display: flex; gap: 3px; justify-content: center; align-items: flex-end;
  padding: 12px 10px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  overflow-x: auto;
}
.chikan .slat {
  flex: 0 0 auto; width: 9px; height: 64px; border-radius: 2px;
  background: color-mix(in srgb, var(--ink) 8%, var(--card));
  border: 1px solid var(--line);
  position: relative;
}
/* 竹の節 */
.chikan .slat::before,
.chikan .slat::after {
  content: ""; position: absolute; left: 0; right: 0; height: 1px;
  background: color-mix(in srgb, var(--ink) 12%, transparent);
}
.chikan .slat::before { top: 32%; }
.chikan .slat::after { top: 66%; }
.chikan .slat.on {
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--midori) 66%, var(--card)),
    var(--midori));
  border-color: color-mix(in srgb, var(--midori) 70%, var(--line));
  box-shadow: 0 1px 3px color-mix(in srgb, var(--midori) 28%, transparent);
}
.chikan .slat.on::before, .chikan .slat.on::after {
  background: color-mix(in srgb, var(--midori) 40%, #000);
  opacity: .5;
}

/* 墨あと */
.sumi-grid {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr);
  gap: 3px; overflow-x: auto; padding-bottom: 2px;
}
.sumi {
  width: 100%; aspect-ratio: 1; min-width: 9px; border-radius: 2px;
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  border: 1px solid color-mix(in srgb, var(--ink) 7%, transparent);
}
.sumi.pad { background: none; border-color: transparent; }
.sumi.lv1 { background: color-mix(in srgb, var(--ink) 18%, transparent); }
.sumi.lv2 { background: color-mix(in srgb, var(--ink) 34%, transparent); }
.sumi.lv3 { background: color-mix(in srgb, var(--ink) 52%, transparent); }
.sumi.lv4 { background: color-mix(in srgb, var(--ink) 72%, transparent); }
.sumi.lv5 { background: color-mix(in srgb, var(--ink) 92%, transparent); }
.sumi.today { outline: 2px solid var(--shu); outline-offset: 1px; }
.sumi-legend { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 12px; font-size: 10.5px; color: var(--ink-3); }
.sumi-legend i { width: 11px; height: 11px; border-radius: 2px; }
.sumi-legend span:first-child { margin-inline-end: 4px; }
.sumi-legend span:last-child { margin-inline-start: 4px; }

/* 分野別の帯 */
.fld-list { display: grid; gap: 15px; }
.fld-h { display: flex; align-items: baseline; gap: 10px; }
.fld-h b { font-family: var(--mincho); font-size: 15px; letter-spacing: .05em; flex: 1; min-width: 0; }
.fld-h span { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fld-bar {
  position: relative; height: 10px; border-radius: 99px; margin-top: 6px;
  background: var(--paper-2); border: 1px solid var(--line); overflow: hidden;
}
.fld-bar > i { position: absolute; inset: 0 auto 0 0; height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.fld-bar > i.t { background: color-mix(in srgb, var(--kin) 34%, transparent); }
.fld-bar > i.m { background: linear-gradient(90deg, var(--kin), var(--shu)); }
.fld-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; }
.fld-total { border-top: 1px dashed var(--line); padding-top: 13px; text-align: center; font-family: var(--mincho); font-size: 15px; letter-spacing: .06em; }

/* 踏破率のリング */
.cov-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
.cov-ring {
  width: 62px; height: 62px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--shu) calc(var(--p) * 1%), color-mix(in srgb, var(--ink) 9%, transparent) 0);
}
.cov-ring span {
  width: 48px; height: 48px; border-radius: 50%; background: var(--card);
  display: grid; place-items: center; font-family: var(--mincho); font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.cov-ring small { font-size: 9px; color: var(--ink-3); }
.cov-t { font-family: var(--mincho); font-size: 13px; margin-top: 7px; letter-spacing: .04em; }
.cov-n { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
@media (max-width: 420px) {
  .cov-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}

/* 関門コレクション */
.foe-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px; text-align: center; }
.foe-slot { display: grid; justify-items: center; gap: 5px; opacity: .34; filter: grayscale(1); transition: all .2s; }
.foe-slot.got { opacity: 1; filter: none; }
.foe-slot small { font-size: 10.5px; color: var(--ink-3); line-height: 1.4; }
@media (min-width: 620px) { .foe-row { grid-template-columns: repeat(8, 1fr); } }

</style>

  { id: 'm004', cat: '訓読', level: 1, q: '書き下し文を作るときのきまりとして誤っているものはどれか。', choices: ['助動詞にあたる漢字はひらがなに直す', '送り仮名は歴史的仮名遣いで書く', '置き字も必ず書き下し文に書く', '再読文字の二度目の読みはひらがなにする'], a: 2, exp: '置き字（而・於・于・乎・矣・焉・兮など）は書き下し文には書かない。その働きは送り仮名に表れている。' },
  { id: 'm005', cat: '訓読', level: 2, stem: '青取^二之於藍^一', q: '傍線部「於」の説明として正しいものはどれか。', choices: ['「おいて」と読み、場所を示す', '読まない置き字で、起点（〜より）を示す', '「ああ」と読む詠嘆', '受身を示し「らル」と読む'], a: 1, exp: '「青は之を藍より取る」。「於」は読まないが、下の語が起点であることを示し、その働きは送り仮名「より」に表れる。' },
  { id: 'm006', cat: '訓読', level: 2, q: '次のうち、置き字になることが「ない」ものはどれか。', choices: ['而', '矣', '則', '兮'], a: 2, exp: '「則」は「すなはチ」と読む字で置き字ではない。置き字の代表は「而・於・于・乎・矣・焉・兮」。' },
  { id: 'm007', cat: '訓読', level: 3, stem: '三人行、必有^二我師^一焉。', q: '文末の「焉」の説明として正しいものはどれか。', choices: ['「いづくんぞ」と読む反語', '読まない置き字で強意・断定を表す', '「ここに」と読む指示語', '「なんぞ」と読む疑問'], a: 1, exp: '文末の「焉」は語調を強める置き字。文頭・動詞の前にあれば「いづクンゾ」と読む疑問・反語の字になる。位置で判断する。' },

  /* ========== 再読文字 ========== */
  { id: 'm010', cat: '再読文字', level: 1, stem: '未^レ聞^二其名^一。', q: '書き下し文として正しいものはどれか。', choices: ['未だ其の名を聞かず。', '未だ其の名を聞かん。', '其の名を聞くこと未だし。', '其の名を未だ聞くべし。'], a: 0, exp: '「未」は「いまダ〜ず」。一度目は副詞「未だ」（漢字のまま）、二度目は打消の助動詞「ず」（ひらがな）。' },
  { id: 'm011', cat: '再読文字', level: 1, stem: '日将^レ暮。', q: '書き下し文として正しいものはどれか。', choices: ['日将に暮るべし。', '日将に暮れんとす。', '日将た暮る。', '日暮れんことを将る。'], a: 1, exp: '「将」は「まさニ〜（未然形）ントす」。「今にも〜しようとする」の意。「且」も同じ読み・意味。' },
  { id: 'm012', cat: '再読文字', level: 2, q: '「宜シク〜ベシ」の意味として最も適当なものはどれか。', choices: ['ぜひ〜する必要がある', '〜するのがよい', '当然〜すべきだ', 'きっと〜だろう'], a: 1, exp: '宜＝適当・勧告「〜するのがよい」／須＝必要「ぜひ〜する必要がある」／当＝当然／応＝推量。訳し分けが頻出。' },
  { id: 'm013', cat: '再読文字', level: 2, q: '「須ラク〜ベシ」の意味として最も適当なものはどれか。', choices: ['ぜひ〜する必要がある', '〜するのがよい', 'ちょうど〜のようだ', 'まだ〜しない'], a: 0, exp: '「須」は必要を表す。「宜シク（〜するのがよい）」との区別が問われやすい。' },
  { id: 'm014', cat: '再読文字', level: 2, stem: '過猶^レ不^レ及。', q: '書き下し文として正しいものはどれか。', choices: ['過ぎたるは猶ほ及ばず。', '過ぎたるは猶ほ及ばざるがごとし。', '過ぎたるは猶ほ及ばんとす。', '過ぎたるは猶ほ及ぶべし。'], a: 1, exp: '再読文字「猶」は「なホ〜ノ（ガ）ごとシ」。「やりすぎるのは足りないのと同じだ」の意。' },
  { id: 'm015', cat: '再読文字', level: 2, stem: '盍^三各言^二爾志^一。', q: '傍線部「盍」の読みとして正しいものはどれか。', choices: ['けだシ', 'なんゾ〜ざル', 'まさニ〜ベシ', 'よろシク〜ベシ'], a: 1, exp: '「盍」は「何不」の合字で「なんゾ〜ざル」。「どうして〜しないのか（すればよいのに）」と相手に促す。字の似た「蓋（けだシ）」と混同しないこと。' },
  { id: 'm016', cat: '再読文字', level: 3, q: '再読文字の書き下し方として正しいものはどれか。', choices: ['一度目も二度目も漢字で書く', '一度目はひらがな、二度目は漢字', '一度目は漢字、二度目はひらがな', '一度目も二度目もひらがな'], a: 2, exp: '例えば「未」は「未だ〜ず」。一度目の副詞は漢字のまま、二度目の助動詞はひらがなに直す。' },
  { id: 'm017', cat: '再読文字', level: 3, q: '「当」と「応」の意味の違いとして正しいものはどれか。', choices: ['当＝当然・義務、応＝推量', '当＝推量、応＝当然・義務', '当＝必要、応＝適当', 'まったく同じで違いはない'], a: 0, exp: 'どちらも読みは「まさニ〜ベシ」だが、「当」は「当然〜すべきだ」、「応」は「きっと〜だろう」という推量寄り。' },

  /* ========== 否定 ========== */
  { id: 'm020', cat: '否定', level: 1, q: '「不」と「非」の使い分けとして正しいものはどれか。', choices: ['不は体言を、非は用言を打ち消す', '不は用言を、非は体言を打ち消す', 'どちらも用言だけを打ち消す', '意味に違いはない'], a: 1, exp: '「不」は動詞・形容詞（用言）を打ち消して「〜ず」、「非」は名詞（体言）を打ち消して「〜にあらズ」。' },
  { id: 'm021', cat: '否定', level: 1, stem: '己所^レ不^レ欲、勿^レ施^二於人^一。', q: '「勿」の読みとして正しいものはどれか。', choices: ['なシ', 'なカレ', 'あらズ', 'ず'], a: 1, exp: '「勿・毋・莫・無」が禁止を表すときは「〜（スル）なカレ」と読む。存在の否定なら「なシ」。命令の相手がいるかで判断する。' },
  { id: 'm022', cat: '否定', level: 2, stem: '不^レ可^レ不^レ慎。', q: '現代語訳として最も適当なものはどれか。', choices: ['慎むことができない', '慎まなくてもよい', '慎まなければならない', '慎むとは限らない'], a: 2, exp: '「不可不」は二重否定で「〜ざルベカラず」。「〜しないことは許されない」→「〜しなければならない」。' },
  { id: 'm023', cat: '否定', level: 2, stem: '無^レ不^レ称^レ善。', q: '現代語訳として最も適当なものはどれか。', choices: ['よいと言う者はいない', 'よいと言わない者はいない', 'よいと言うとは限らない', 'よいと言ってはならない'], a: 1, exp: '「無不」＝「〜ざルハなシ」。二重否定なので強い肯定「みなよいと言う」となる。' },
  { id: 'm024', cat: '否定', level: 2, stem: '未^三嘗不^二嘆息^一。', q: '書き下し文として正しいものはどれか。', choices: ['未だ嘗て嘆息せず。', '未だ嘗て嘆息せずんばあらず。', '嘗て嘆息するを未だせず。', '未だ嘗て嘆息するなかれ。'], a: 1, exp: '「未嘗不」は再読文字＋二重否定。「今まで〜しなかったことは一度もない」という強い肯定。' },
  { id: 'm025', cat: '否定', level: 2, q: '「不必」と「必不」の違いとして正しいものはどれか。', choices: ['不必＝必ず〜しない、必不＝必ずしも〜ない', '不必＝必ずしも〜とは限らない、必不＝必ず〜しない', '意味は同じで語順だけ違う', 'どちらも全部否定'], a: 1, exp: '「不＋副詞」＝部分否定、「副詞＋不」＝全部否定。「不必（必ずしも〜ず）」は部分否定、「必不（必ず〜ず）」は全部否定。' },
  { id: 'm026', cat: '否定', level: 2, stem: '伯楽不^二常有^一。', q: '傍線部の読みと意味の組み合わせとして正しいものはどれか。', choices: ['常に有らず／いつもいない', '常には有らず／いつもいるとは限らない', '常に有らんや／どうしているだろうか', '常に有るなかれ／いてはならない'], a: 1, exp: '「不常」は部分否定で「常ニハ〜ず」。読みに「は」が入るのが目印。全部否定「常不（常に〜ず）」と区別する。' },
  { id: 'm027', cat: '否定', level: 3, q: '部分否定の書き下しで、副詞のあとに「は」を入れないのが原則の語はどれか。', choices: ['常', '倶', '必', '尽'], a: 2, exp: '「不必」は「必ずしも〜ず」となり「は」ではなく「しも」が入る。「不常＝常には」「不倶＝倶には」「不尽＝尽くは」。' },
  { id: 'm028', cat: '否定', level: 2, stem: '不^レ能^二自已^一。', q: '傍線部「不能」の読みとして正しいものはどれか。', choices: ['あたハず', 'ベカラず', 'えず', 'なシ'], a: 0, exp: '「不能」は「〜（スル）あたハず」で能力的な不可能。「不可（ベカラず）」は不可能・禁止、「不得（えず）」は状況的な不可能。' },
  { id: 'm029', cat: '否定', level: 3, stem: '非^レ不^レ説^二子之道^一。', q: '現代語訳として最も適当なものはどれか。', choices: ['先生の道を喜んではいけない', '先生の道を喜ばないわけではない', '先生の道を喜ぶ者はいない', '先生の道を喜ぶに違いない'], a: 1, exp: '「非不」は「〜ざルニあらズ」。二重否定だが、全面肯定ではなく「〜しないわけではない」とやわらげた肯定になる。' },

  /* ========== 疑問・反語 ========== */
  { id: 'm030', cat: '疑問反語', level: 1, q: '疑問形と反語形を見分ける最大の手がかりはどれか。', choices: ['文頭の字の種類', '文末が「ン（ヤ）」で結ばれているかどうか', '返り点の数', '置き字の有無'], a: 1, exp: '同じ「何ゾ」「安クンゾ」でも、文末が推量・意志の「ン（ヤ）」なら反語、連体形＋「や・か」なら疑問。' },
  { id: 'm031', cat: '疑問反語', level: 2, stem: '燕雀安知^二鴻鵠之志^一哉。', q: 'この文の意味として最も適当なものはどれか。', choices: ['ツバメやスズメはどうやって大鳥の志を知るのか', 'ツバメやスズメにどうして大鳥の志が分かろうか、いや分からない', 'ツバメやスズメも大鳥の志を知っている', 'ツバメやスズメよ、大鳥の志を知りなさい'], a: 1, exp: '「安くんぞ〜知らんや」と文末が「ンヤ」なので反語。「どうして〜か、いや〜ない」と訳す。' },
  { id: 'm032', cat: '疑問反語', level: 2, q: '「何如」と「如何」の違いとして正しいものはどれか。', choices: ['何如＝手段を問う、如何＝状態を問う', '何如＝状態を問う、如何＝手段を問う', 'どちらも状態を問う', 'どちらも手段を問う'], a: 1, exp: '「何如（いかん）」は様子・状態・程度を問い、疑問にしか使わない。「如何（いかんセン／いかんゾ）」は手段・方法や理由を問い、反語にもなる。' },
  { id: 'm033', cat: '疑問反語', level: 2, q: '「何為レゾ」の読みとして正しいものはどれか。', choices: ['なんすレゾ', 'なにためニ', 'いかんゾ', 'なんタリ'], a: 0, exp: '「何為」は「なんすレゾ」と読み、理由を問う。読みが独特なので狙われやすい。' },
  { id: 'm034', cat: '疑問反語', level: 1, q: '「安」を「いづクンゾ」と読むとき、問うているのは何か。', choices: ['場所', '理由', '人物', '数量'], a: 1, exp: '「いづクンゾ」は理由を問う（多くは反語）。場所を問うときは「いづクニカ」と読む。同じ字で読み分ける。' },
  { id: 'm035', cat: '疑問反語', level: 2, stem: '王侯将相寧有^レ種乎。', q: '傍線部「寧」の読みと働きの組み合わせとして正しいものはどれか。', choices: ['むしロ／選択', 'いづクンゾ／反語', 'なんゾ／詠嘆', 'やすシ／形容詞'], a: 1, exp: '「寧」は「いづクンゾ」と読んで反語を表す用法と、「むしロ」と読んで選択を表す用法がある。ここは文末「乎」と呼応する反語。' },
  { id: 'm036', cat: '疑問反語', level: 3, stem: '何必曰^レ利。', q: '書き下し文として正しいものはどれか。', choices: ['何ぞ必ず利と曰ふ。', '何ぞ必ずしも利と曰はん。', '必ずしも何ぞ利と曰はず。', '何ぞ利と曰ふ必要あらん。'], a: 1, exp: '反語なので文末は「ン」。「不必」でなくても「何ぞ必ずしも」と「しも」を入れて読むのが慣例。' },
  { id: 'm037', cat: '疑問反語', level: 2, q: '数量を問う「幾何」の読みとして正しいものはどれか。', choices: ['いくばく', 'いかん', 'いくたび', 'きか'], a: 0, exp: '「幾何」「幾許」は「いくばく」。「人生幾何ぞ（人生はどれほどのものか）」のように使う。' },

  /* ========== 使役・受身 ========== */
  { id: 'm040', cat: '使役', level: 1, stem: '天帝使^三我長^二百獣^一。', q: '書き下し文として正しいものはどれか。', choices: ['天帝我をして百獣に長たらしむ。', '天帝我に使ひして百獣に長たり。', '天帝我の百獣に長たるを使ふ。', '天帝我をして百獣に長たらんとす。'], a: 0, exp: '「使AB」は「AヲシテB（セ）しム」。Bは未然形で受けて助動詞「しむ」に続く。' },
  { id: 'm041', cat: '使役', level: 2, q: '使役の助字として用いられ「しム」と読む字の組み合わせとして正しいものはどれか。', choices: ['使・令・教・遣・俾', '使・被・見・為・所', '使・雖・苟・縦・若', '使・唯・但・独・徒'], a: 0, exp: '「使・令・教・遣・俾」が使役の助字。「被・見・為〜所」は受身、「雖・苟・縦」は仮定、「唯・但・独・徒」は限定。' },
  { id: 'm042', cat: '使役', level: 3, q: '使役の助字がないのに使役に読むのはどのような場合か。', choices: ['文末に「矣」があるとき', '「命・召・遣・説・勧」など意味の上で使役を含む動詞があるとき', '返り点が三つ以上あるとき', '置き字が二つ以上あるとき'], a: 1, exp: '「命ジテ〜シム」のように、命令・派遣・説得などの動詞は使役の助字がなくても「しむ」を補って読む。' },
  { id: 'm043', cat: '受身', level: 1, stem: '信而見^レ疑、忠而被^レ謗。', q: '傍線部「見」「被」の読みとして正しいものはどれか。', choices: ['みル／こうむル', 'らル（受身）', 'しム（使役）', 'あらズ（否定）'], a: 1, exp: '動詞の上に置かれた「見」「被」は受身の助字で「〜（セ）らル」。「見」を「みる」と読まない点が要注意。' },
  { id: 'm044', cat: '受身', level: 2, stem: '後則為^二人所^一レ制。', q: '傍線部「所」の読みとして正しいものはどれか。', choices: ['ところ', 'る', 'ゆゑ', 'しょ'], a: 0, exp: '「為A所B」は「AノB（スル）ところトなル」。この「所」は必ず「ところ」と読み、「る」とは読まない。' },
  { id: 'm045', cat: '受身', level: 2, stem: '労^レ力者治^二於人^一。', q: 'この文の意味として最も適当なものはどれか。', choices: ['肉体労働をする者は人を治める', '肉体労働をする者は人に治められる', '肉体労働をする者は人より優れている', '肉体労働をする者は人と治める'], a: 1, exp: '「於」の下が動作主のときは受身。「人に治めらる」と読み、送り仮名「らル」に受身の働きが表れる。' },

  /* ========== 比較・選択 ========== */
  { id: 'm050', cat: '比較', level: 1, stem: '百聞不^レ如^二一見^一。', q: 'この文の意味として最も適当なものはどれか。', choices: ['百回聞けば一回見たのと同じだ', '百回聞くことは一回見ることに及ばない', '百回聞いても一回も見ない', '百回聞くほうが一回見るよりよい'], a: 1, exp: '「A不如B」は「AハBニしカず」で、後ろのBのほうが優れている。' },
  { id: 'm051', cat: '比較', level: 2, q: '「莫如A（Aニしクハなシ）」が表す意味として正しいものはどれか。', choices: ['AはBに及ばない（二者比較）', 'Aに及ぶものはない（最上級）', 'AでもBでもない（全否定）', 'AかBかどちらかだ（選択）'], a: 1, exp: '「不如」は二者の比較、「莫如・莫若・無如」は「Aが一番だ」という最上級を表す。' },
  { id: 'm052', cat: '比較', level: 2, stem: '霜葉紅^二於二月花^一。', q: '傍線部「於」の働きとして正しいものはどれか。', choices: ['受身の動作主を示す', '比較の基準を示す', '場所を示す', '使役の対象を示す'], a: 1, exp: '形容詞の下の「於（于・乎）」は比較の基準を示す置き字。「二月の花よりも紅なり」と「より（も）」を送る。' },
  { id: 'm053', cat: '選択', level: 2, stem: '与^二其奢^一也、寧倹。', q: 'この文の意味として最も適当なものはどれか。', choices: ['ぜいたくと質素の両方がよい', 'ぜいたくをするくらいなら、むしろ質素にせよ', '質素にするよりぜいたくがよい', 'ぜいたくも質素もしてはならない'], a: 1, exp: '「与其A、寧B」は「そノAセンヨリハ、むしロBセヨ」。前を捨てて後ろを選ぶ形。' },
  { id: 'm054', cat: '選択', level: 3, q: '「孰与A（Aニいづレゾ）」の含みとして最も適当なものはどれか。', choices: ['Aのほうが劣ると言外に示す', 'どちらでもよいと示す', '後者のほうがよいのではないかと言外に示す', '両方とも否定する'], a: 2, exp: '「孰与・孰若」は形は疑問だが、多くは「むしろ後者のほうがよいのではないか」という選択の含みをもつ。' },

  /* ========== 仮定 ========== */
  { id: 'm060', cat: '仮定', level: 1, stem: '雖^レ有^二嘉肴^一、弗^レ食不^レ知^二其旨^一也。', q: '傍線部「雖」の読みとして正しいものはどれか。', choices: ['いへどモ', 'いやしクモ', 'たとヒ', 'もシ'], a: 0, exp: '「雖」は「〜ト いへどモ」。「〜だけれども」（確定条件）と「たとえ〜でも」（仮定条件）の両方がある。' },
  { id: 'm061', cat: '仮定', level: 2, q: '「苟」の読みとして正しいものはどれか。', choices: ['もシ', 'いやしクモ', 'たとヒ', 'なホ'], a: 1, exp: '「苟」は「いやしクモ〜ば」で「かりにも〜ならば」。読みが問われやすい語。' },
  { id: 'm062', cat: '仮定', level: 2, q: '「縦」を仮定に読むときの読みとして正しいものはどれか。', choices: ['たとヒ〜トモ', 'もシ〜ば', 'いやしクモ〜ば', 'なカリセバ'], a: 0, exp: '「縦（縦令・仮令）」は逆接の仮定「たとえ〜としても」。順接の「如・若・苟」と区別する。' },
  { id: 'm063', cat: '仮定', level: 3, stem: '微^二管仲^一、吾其被^レ髪左^レ衽矣。', q: '傍線部「微」の読みと意味の組み合わせとして正しいものはどれか。', choices: ['かすカニ／わずかに', 'なカリセバ／もし〜がなかったら', 'びニ／細かく', 'なシ／〜がない'], a: 1, exp: '「微A」は反実仮想で「Aなカリセバ（もしAがなかったら）」。読みが難しく差がつく語。' },
